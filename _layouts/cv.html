---
layout: default
---
<style>
.cv-page {
  background: #0f1f17;
  min-height: calc(100vh - 66px);
  padding: 3em 4em 4em;
  color: rgba(255,255,255,0.9);
}
.cv-page .cv-inner {
  max-width: 780px;
  margin: 0 auto;
}
.cv-page h1 {
  font-size: 2em;
  color: #fff;
  margin-bottom: 0.4em;
  border-left: 3px solid #d4c5f0;
  padding-left: 0.5em;
  margin-left: -0.65em;
}
.cv-page .cv-pdf-btn {
  display: inline-block;
  margin-bottom: 1.5em;
  padding: 0.45em 1.2em;
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 3px;
  font-size: 0.88em;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
}
.cv-page .cv-pdf-btn:hover {
  background: rgba(255,255,255,0.08);
  text-decoration: none;
}
.cv-page h2 {
  font-size: 1.25em;
  color: #d4c5f0;
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.cv-page h3 {
  font-size: 1em;
  color: #fff;
  margin-bottom: 0.2em;
}
.cv-page p, .cv-page li { line-height: 1.7; }
.cv-page a { color: #d4c5f0; }
.cv-page a:hover { text-decoration: underline; }
.cv-page strong { color: #fff; }
.cv-page hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.1);
  margin: 2em 0;
}
@media (max-width: 600px) {
  .cv-page { padding: 2em 1.5em 3em; }
}
</style>

<div class="cv-page">
  <div class="cv-inner">
    {{ content }}
  </div>
</div>
